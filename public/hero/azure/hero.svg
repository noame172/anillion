    <path d="M68 98 L46 56 L78 70 L72 14 L104 56 L120 0 L138 56 L170 12 L162 70 L196 54 L172 98 Z" fill="url(#hair)" stroke="#1e9bff" stroke-width="2" stroke-linejoin="round"/>
    <path d="M84 90 L80 112 L94 96 Z M156 90 L160 112 L146 96 Z" fill="#1e9bff"/>
