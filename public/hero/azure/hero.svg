  <path d="M92 214 L78 296 L104 296 L118 232 L136 296 L162 296 L148 214 Z" fill="#141a3c"/>
  <path d="M74 292 h34 v12 h-38 z M132 292 h34 v12 h-34 z" fill="#2aa8ff"/>
